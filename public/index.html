<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מחשבון חשמל — הגולן 28</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#DB7A4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="חשמל 28">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="page">
    <header>
      <div class="brand-row">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="brand-text">
          <h1>חשמל והגולן 28</h1>
          <p class="subtitle">מחשבון חיוב לדייר</p>
        </div>
      </div>
      <button type="button" id="historyToggle" class="history-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7v5l3.5 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>היסטוריית חיובים</span>
      </button>
    </header>

    <section class="card">
      <div class="field">
        <label for="tenantName">שם הדייר (רשות)</label>
        <input type="text" id="tenantName" list="tenantNamesList" placeholder="שם הדייר (רשות)">
        <datalist id="tenantNamesList"></datalist>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="currReading">מספר סופי</label>
          <input type="number" id="currReading" step="0.01" placeholder="0">
        </div>
        <div class="field">
          <label for="prevReading">מספר התחלתי</label>
          <input type="number" id="prevReading" step="0.01" placeholder="0">
        </div>
      </div>

      <div class="consumption-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>צריכה בתקופה</span>
        <span class="consumption-value"><span id="kwhReadout">0.00</span> קוט"ש</span>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="periodStart">תחילת התקופה</label>
          <input type="date" id="periodStart">
        </div>
        <div class="field">
          <label for="periodEnd">סוף התקופה</label>
          <input type="date" id="periodEnd">
        </div>
      </div>
    </section>

    <section class="card">
      <div class="field">
        <div class="field-label-row">
          <label>מחיר לקוט"ש (כולל מע"מ)</label>
          <span class="auto-badge" id="rateBadge">מתעדכן אוטומטית</span>
        </div>
        <div class="readout rate-readout" id="rateReadout">—</div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="discountPercent">הנחה חודשית (%)</label>
          <input type="number" id="discountPercent" min="0" max="100" step="0.1" placeholder="0">
        </div>
        <div class="field">
          <label for="fixedExpenses">חיוב קבוע חודשי (₪)</label>
          <input type="number" id="fixedExpenses" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="field">
        <label for="water">חיוב מים חודשי (₪)</label>
        <input type="number" id="water" min="0" step="0.01" placeholder="0.00">
      </div>
      <p class="hint">ההנחה, החיוב הקבוע וחיוב המים נשמרים אוטומטית לפעם הבאה, וכולם מוכפלים במספר החודשים בתקופה שהוזנה למעלה (ההנחה מחושבת כאחוז מעלות החשמל).</p>
    </section>

    <section class="card results" id="resultsCard" hidden>
      <h2>סיכום</h2>
      <div id="summaryText"></div>
      <button type="button" id="saveHistoryBtn" class="btn-primary">שמור והתחל תקופה חדשה</button>
    </section>

    <div class="actions">
      <button type="button" id="calcBtn" class="btn-primary">חשב חיוב</button>
    </div>
  </div>

  <div class="modal-overlay" id="historyModal" hidden>
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2>היסטוריית חיובים</h2>
        <button type="button" id="closeHistory" class="link-btn">סגור ✕</button>
      </div>
      <div id="historyList" class="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
